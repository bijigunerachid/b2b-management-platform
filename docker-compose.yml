# Production-style stack: MySQL + API + nginx serving the built frontend.
#
#   cp .env.example .env      # then fill in the secrets
#   docker compose up -d --build
#
# Open http://localhost:8080 (or the HTTP_PORT you set).

name: b2b-platform

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: b2b_management
      # Least-privilege account the API connects with (not root).
      MYSQL_USER: b2b_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
      # Runs once, on first start with an empty volume.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # TCP ping: fails while MySQL's init-time server (socket only) runs,
      # so dependents wait for the real server.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # No ports published: the database is only reachable inside the stack.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_USER: b2b_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: b2b_management
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters)}
      # Optional: lets the help assistant answer with Claude (see .env.example).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-haiku-5-5}
      ASSISTANT_DAILY_LIMIT: ${ASSISTANT_DAILY_LIMIT:-300}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      # Links in emails to clients point here (the client portal).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Optional: a mail server for emails to clients. Without SMTP_HOST,
      # emails are only saved to the in-app outbox.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_REMINDERS: ${EMAIL_REMINDERS:-true}
      EMAIL_REMINDER_DAYS: ${EMAIL_REMINDER_DAYS:-3}
      # Public live demo only (see docs/live-demo.md). Never on real data.
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_RESET_TIME: ${DEMO_RESET_TIME:-03:00 UTC}
      # nginx sits in front: trust one proxy hop for client IPs.
      TRUST_PROXY: 1
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Model training (demand forecast, payment risk, recommendations). Not
  # started by `up`: run a job when you want fresh results, e.g. weekly from cron.
  #   docker compose --profile ml run --rm ml forecast
  ml:
    build: ./ml
    profiles: ["ml"]
    environment:
      DB_HOST: db
      DB_USER: b2b_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: b2b_management
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
